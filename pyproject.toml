[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesomefigures"
version = "0.1.0"
description = "Publication-ready scientific figures and accessible Matplotlib styling."
keywords = ["matplotlib", "scientific visualization", "latex", "color palettes", "publication"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Heriberto Espino Montelongo" }
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "colorspacious>=1.1.2",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/awesomefigures/awesomefigures"
Documentation = "https://github.com/awesomefigures/awesomefigures/tree/main/docs/source"
Source = "https://github.com/awesomefigures/awesomefigures"
Issues = "https://github.com/awesomefigures/awesomefigures/issues"
Changelog = "https://github.com/awesomefigures/awesomefigures/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pyyaml>=6", "pypdf>=4"]
docs = [
  "sphinx>=7",
  "pydata-sphinx-theme>=0.22,<0.24",
  "sphinx-design>=0.6",
  "myst-nb>=1.1",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "ipykernel>=6",
]
notebooks = ["jupyterlab>=4"]
publication = ["pypdf>=4"]
release = ["build>=1", "twine>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
